  const key = "whats-old:theme";
  const system = matchMedia("(prefers-color-scheme: dark)");
  let choice;
  function readChoice() {
    try { choice = localStorage.getItem(key); } catch { /* Keep the current page preference. */ }
  }
  function render() {
    const dark = choice === "dark" || (choice !== "light" && system.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    for (const source of document.querySelectorAll("source[data-dark-cover]")) {
      source.media = dark ? "all" : "not all";
    }
    const label = dark ? "切换浅色模式" : "切换深色模式";
    for (const button of document.querySelectorAll("[data-switch-theme]")) {
      button.setAttribute("aria-label", label);
      button.title = label;
      button.hidden = false;
    }
  }
  readChoice();
  render();
  document.addEventListener("DOMContentLoaded", render, {once: true});
  document.addEventListener("click", event => {
    if (!event.target.closest("[data-switch-theme]")) return;
    choice = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(key, choice); } catch { /* Keep the choice for this page. */ }
    render();
  });
  system.addEventListener("change", render);
  window.addEventListener("storage", event => {
    if (event.key === key || event.key === null) { readChoice(); render(); }
  });
  window.addEventListener("pageshow", event => {
    if (event.persisted) { readChoice(); render(); }
  });
})();

用 ## 预测振动数据的传统统计学方法 ### 自回归积分滑动平均模型 (ARIMA) ### 指数平滑技术 ### 回归分析 ## 利用人工智能进行振动数据预测 ### 机器学习方法 ### 深度学习架构 ## 人工智能在增强振动时间序列分析中的作用 ### 基于人工智能的结构振动异常检测 ### 基于人工智能的预测性维护策略 ## 实际应用案例分析 ## 传统统计方法与人工智能方法在预测振动数据方面的优缺点比较 ## 将时间序列预测应用于结构动力学数据时存在的特定挑战和考虑因素 ## 结论与未来展望 #### 引用的著作"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-base-excitation","keywords":"基底激励方程求出的 $u$ 是楼层相对地面的位移。若要考察设备或构件承受的惯性作用，还要还原绝对加速度 $\\ddot{x}=\\ddot{u}+r\\ddot{u}_g$。把两种响应混在一起，曲线可能看着合理，物理意义已经换了。"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-time-history-checks","keywords":"时程积分跑完，只能说明程序给出了一组数。线性多自由度体系还可以检查矩阵的正定性与模态正交性，对比物理坐标解和完整模态解，再计算归一化动力平衡残差。这几项分别核对模型装配、坐标变换和时程积分。"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-modal-truncation","keywords":"模态截断不能只看累计有效质量。有效质量描述一致输入在各阶模态上的投影，截断误差还要针对位移、加速度或内力分别计算。前三阶达到某个累计比例，不等于所有响应量都获得同样精度。"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-rayleigh-damping","keywords":"Rayleigh阻尼用两个目标频率确定两个系数，因此“5%阻尼”只在选定模态上精确成立。更换拟合模态，频带两端的阻尼分布也会改变。报告结果时应同时写出目标阻尼比和拟合模态，单写一个5%不够。"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-ito-stratonovich","keywords":"从随机微分方程写到FPK方程前，需要先说明随机积分采用Itô还是Stratonovich。乘性噪声下，两种解释之间会出现漂移修正项；符号看起来只差一个标记，概率密度的演化方程已经不同。"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-irregular-sampling","keywords":"非均匀采样序列在做FFT前通常要先重采样，插值方法也会影响后续分析。线性插值、样条插值和基于里程—速度关系的重建没有统一选择，至少要比较它们对频谱、导数和预测误差的影响。预处理不是一次无代价的格式转换。"},{"title":"2026-08-01 随手记","detail":"随手记","url":"/sci-notes/status/#status-2026-08-01-compressed-sensing","keywords":"压缩感知能够用较少的测量重建信号，还有两个前提：信号在某个变换域内足够稀疏，测量矩阵满足可恢复条件。测量次数、噪声和稀疏度共同影响结果，重建失败不能只归到算法选择上。"}]</script>  </body> </html> <script type="module" src="/sci-notes/_astro/Shell.astro_astro_type_script_index_0_lang.CyOv_yeK.js"></script> <script type="module" src="/sci-notes/_astro/BrowseRedirect.astro_astro_type_script_index_0_lang
